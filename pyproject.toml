[project]
name = "pdf-ocr"
version = "0.1.0"
description = ""
authors = [
    {name = "Atsushi",email = "atsushi.shindo@it-libero.jp"}
]
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "torch (==2.13.0)",
    "torchvision (>=0.28.0,<0.29.0)",
    "easyocr (>=1.7.2,<2.0.0)",
    "pymupdf (>=1.28.0,<2.0.0)",
    "rapidfuzz (>=3.14.5,<4.0.0)",
    "pyyaml (>=6.0.3,<7.0.0)"
]

[tool.poetry]
packages = [{include = "pdf_ocr", from = "src"}]

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"


[tool.poetry.dependencies]
torch = {source = "pytorch-cpu"}
torchvision = {source = "pytorch-cpu"}
[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "ruff (>=0.16.0,<0.17.0)"
]
